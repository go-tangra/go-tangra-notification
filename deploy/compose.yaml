# Development / integration stack for services/notification alone (compose
# project "notification"). Never use these credentials outside a workstation.
# The platform stack (services/gateway/deploy) provides gateway and auth.
services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: notification
    ports: ["5434:5432"]
    volumes: ["./init-db.sql:/docker-entrypoint-initdb.d/10-init.sql:ro"]
  valkey:
    image: valkey/valkey:8
    command: ["valkey-server", "--requirepass", "dev", "--user", "notification", "on", ">dev", "~*", "&*", "+@all"]
    ports: ["6381:6379"]
  mailpit:
    image: axllent/mailpit:latest
    ports: ["8027:8025", "1027:1025"]
